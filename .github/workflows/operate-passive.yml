name: Passive Operate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  passive-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run passive analysis
        run: node scripts/run_analysis_and_patch.js
        env:
          CI: true
